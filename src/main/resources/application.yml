  spring:
    application:
      name: fraud-rule-engine

    datasource:
      url: jdbc:mysql://localhost:13306/frauddb
      username: frauduser
      password: fraudpassword
      driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true

    sql:
      init:
        mode: never

    flyway:
      enabled: false

  server:
    port: 8080

  fraud:
    claims:
      threshold: 50000
