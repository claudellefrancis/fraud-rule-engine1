services:
  mysql:
    image: mysql:8.4
    container_name: fraud-mysql

    environment:
      MYSQL_DATABASE: frauddb
      MYSQL_USER: frauduser
      MYSQL_PASSWORD: fraudpassword
      MYSQL_ROOT_PASSWORD: rootpassword

    ports:
      - "13306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    restart: unless-stopped

volumes:
  mysql_data:
