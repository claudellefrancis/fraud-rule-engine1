services:
  version: '3.8'

  services:

    postgres:
      image: postgres:17
      container_name: fraud-postgres

      environment:
        POSTGRES_DB: frauddb
        POSTGRES_USER: frauduser
        POSTGRES_PASSWORD: fraudpassword

      ports:
        - "5432:5432"

      volumes:
        - postgres_data:/var/lib/postgresql/data

  volumes:
    postgres_data: